<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <script src="./assets/js/script.js" defer></script>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

        <!-- Encabezado y navegación unificado -->
        <header class="bg-orange-600 text-white shadow-md sticky top-0 z-50">
            <div class="container mx-auto px-4 py-3 flex items-center justify-between">
                
                <!-- Logo -->
                <a href="index.html" class="flex items-center space-x-2">
                    <div class="bg-white rounded-full h-10 w-10 flex items-center justify-center text-xl shadow-sm">🌋</div>
                    <span class="text-xl font-bold text-white">Gas El Volcán</span>
                </a>
                
                <!-- Acceso directo al Carrito + Botón Menú -->
                <div class="flex items-center space-x-3">
                    <a href="carrito.html" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-2 px-3 rounded-lg shadow flex items-center space-x-1 transition text-sm"> 
                        <span>🛒</span>
                        <span class="cart-counter">(0)</span>
                    </a>

                    <!-- Botón de Menú Hamburguesa -->
                    <button id="mobile-menu-btn" class="text-white focus:outline-none p-2 rounded-lg hover:bg-orange-700 transition" aria-label="Abrir menú">
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Menú Desplegable Unificado -->
            <div id="mobile-menu" class="hidden bg-orange-700 border-t border-orange-500 px-4 pt-3 pb-4 space-y-2">
                <a href="index.html" class="block font-medium hover:bg-orange-800 px-3 py-2 rounded-md transition">Inicio</a>
                <a href="nosotros.html" class="block font-medium hover:bg-orange-800 px-3 py-2 rounded-md transition">Nosotros</a>
                <a href="index.html#contacto" class="block font-medium hover:bg-orange-800 px-3 py-2 rounded-md transition">Contacto</a>
                <a href="login.html" class="block font-medium hover:bg-orange-800 px-3 py-2 rounded-md transition">Iniciar Sesión</a>
            </div>
        </header>

    <main class="flex-grow flex items-center justify-center px-4">
        <section class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">

            <!-- Bienvenida centrada -->
            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold mb-2">Bienvenido</h2>
                <p class="text-gray-600">Ingresa tus datos para acceder a tu cuenta.</p>
            </div>

            <!-- Formulario -->
            <form id="form-login" class="space-y-4">

                <div>
                    <label for="correo" class="block text-left text-gray-700 font-medium mb-1">
                        Correo Electrónico:
                    </label>
                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Ingresa tu correo"
                        autocomplete="email"
                        required
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500"
                    >
                </div>

                <div>
                    <label for="contrasena" class="block text-left text-gray-700 font-medium mb-1">
                        Contraseña:
                    </label>
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Ingresa tu contraseña"
                        autocomplete="current-password"
                        required
                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500"
                    >
                </div>

                <button
                    type="submit"
                    class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded"
                >
                    Iniciar Sesión
                </button>
            </form>

            <!-- Links -->
            <div class="text-center mt-6 space-y-2">
                <p>¿No tienes una cuenta?
                    <a href="registro.html" class="text-orange-600 hover:underline">Regístrate aquí</a>
                </p>
                <p>
                    <a href="index.html" class="text-orange-600 hover:underline">Volver a la página principal</a>
                </p>
            </div>

        </section>
    </main>
    
    <footer>
        <div>
            <p>2026 Distribuidora de gas El Volcan. Todos los derechos reservados.</p>
            <p>Proyecto Informatica / DuocUC.</p>
        </div>
    </footer>
</body>
</html>
