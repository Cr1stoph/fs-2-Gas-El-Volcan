<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesion</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <header>
        <h1>Iniciar Sesion</h1>
    </header>

    <main>
        <section>
        <h2>Bienvenido</h2>
        <p>Ingresa tus datos para acceder a tu cuenta.</p>

        <form id="form-login">
            <div>
                <label for="correo">Correo Electronico:</label>
                <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" autocomplete="email" required>
            </div>

            <div>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" autocomplete="current-password" required>
            </div>

            <button type="submit">Submit</button>
        </form>
            
            <p>¿No tienes una cuenta? <a href="registro.html">Registrate aquí</a></p>

            <p><a href="index.html">Volver a la página principal</a></p>
        </section>
    </main>

    <footer>
    </footer>
</body>

</html>
