<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <header>
        <h1>Crear Cuenta</h1>
    </header>

    <main>
        <section>
        <h2>Regístrate</h2>
        <p>Completa tus datos para crear una cuenta.</p>

        <form id="form-registro">
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" autocomplete="name" required>
            </div>

            <div>
                <label for="correo">Correo Electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" autocomplete="email" required>
            </div>

            <div>
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" autocomplete="new-password" required>
            </div>

            <button type="submit">Submit</button>
        </form>

        <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>

        <p><a href="index.html">Volver a la página principal</a></p>
        </section>
    </main>
    
</body>

</html>
