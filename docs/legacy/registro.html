<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta</title>
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">
    <header class="bg-orange-600 text-white shadow-md py-4">
        <h1 class="text-xl font-bold text-center">Crear Cuenta</h1>
    </header>

    <main class="flex-grow flex items-center justify-center px-4">
        <section class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">

            <div class="text-center mb-6">
                <h2 class="text-2xl font-bold mb-2">Regístrate</h2>
                <p class="text-gray-600">Completa tus datos para crear una cuenta.</p>
            </div>

            <form id="form-registro" class="space-y-4">
                <div>
                    <label for="nombre" class="block text-left text-gray-700 font-medium mb-1">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" autocomplete="name" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>

                <div>
                    <label for="correo"class="block text-left text-gray-700 font-medium mb-1">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="Ingresa tu correo" autocomplete="email" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>

                <div>
                    <label for="contrasena" class="block text-left text-gray-700 font-medium mb-1">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" autocomplete="new-password" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500">
                </div>

                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-4 rounded">Regístrate</button>
            </form>

            <div class="text-center mt-6 space-y-2">
                <p>¿Ya tienes una cuenta? <a href="login.html" class="text-orange-600 hover:underline">Inicia sesión aquí</a></p>
                <p><a href="index.html" class="text-orange-600 hover:underline">Volver a la página principal</a></p>
            </div>
        </section>
    </main>

    <footer>
        <div>
            <p>2026 Distribuidora de gas El Volcan. Todos los derechos reservados.</p>
            <p>Proyecto Informatica / DuocUC.</p>
        </div>
    </footer>
    
</body>

</html>
