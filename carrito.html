<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gas El Volcán - Carrito de Compras</title>
    <link rel="stylesheet" href="./assets/css/style.css">
    <!-- Vinculación del script principal -->
    <script src="./assets/js/script.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen flex flex-col">

    <header class="bg-orange-600 text-white shadow-md">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="bg-white rounded-full h-10 w-10 flex items-center justify-center text-xl shadow-sm">🌋</div>
                <span class="text-xl font-bold text-white">Gas El Volcán</span>
            </a>
            <nav class="hidden md:flex items-center space-x-6 text-white font-medium">
                <a href="index.html" class="hover:text-orange-200 transition">Inicio</a>
                <a href="productos.html" class="hover:text-orange-200 transition">Productos</a>
                <a href="nosotros.html" class="hover:text-orange-200 transition">Nosotros</a>
                <a href="contacto.html" class="hover:text-orange-200 transition">Contacto</a>
            </nav>
            <div class="flex items-center space-x-4 text-white">
                <a href="login.html" class="font-medium hover:text-orange-200 transition">Iniciar Sesión</a>
                <a href="carrito.html" class="bg-yellow-500 hover:bg-yellow-400 text-gray-900 font-bold py-2 px-4 rounded-lg shadow flex items-center space-x-1">
                    <span>🛒</span>
                    <span id="cart-counter">(0)</span>
                </a>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <h1 class="text-3xl font-extrabold text-gray-900 mb-6">Carrito de Compras</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <section class="lg:col-span-2 bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex justify-between items-center border-b pb-4 mb-4">
                    <h2 class="text-xl font-bold text-gray-800">Detalle del Pedido</h2>
                    <button type="button" id="btn-empty-cart" class="text-sm text-red-600 hover:text-red-800 font-semibold transition">
                        🗑️ Vaciar Carrito
                    </button>
                </div>

                <div id="cart-items-container"></div>

                <div id="empty-cart-msg" class="hidden text-center py-12">
                    <span class="text-5xl mb-3 block">🛒</span>
                    <h3 class="text-lg font-bold text-gray-700 mb-1">Tu carrito está vacío</h3>
                    <a href="index.html" class="inline-block mt-4 bg-orange-600 hover:bg-orange-700 text-white font-bold py-2 px-6 rounded-lg transition">Ver Productos</a>
                </div>
            </section>

            <aside class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-4 h-fit">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-3">Resumen</h2>
                <div class="flex justify-between text-sm text-gray-600">
                    <span>Subtotal:</span>
                    <span id="subtotal-val" class="font-semibold text-gray-800">$0</span>
                </div>
                <div class="flex justify-between items-center border-t pt-3 text-lg font-extrabold">
                    <span>Total:</span>
                    <span id="total-val" class="text-2xl text-orange-600">$0</span>
                </div>

                <form id="checkout-form" class="pt-4 border-t space-y-4">
                    <div>
                        <label for="direccion" class="block text-xs font-semibold text-gray-700 mb-1">Dirección en Chillán *</label>
                        <input type="text" id="direccion" name="direccion" required class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none">
                    </div>
                    <div>
                        <label for="telefono" class="block text-xs font-semibold text-gray-700 mb-1">Teléfono *</label>
                        <input type="tel" id="telefono" name="telefono" required class="w-full text-sm border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-orange-500 focus:outline-none">
                    </div>
                    <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-lg transition shadow">
                        Confirmar Pedido
                    </button>
                </form>
            </aside>
        </div>
    </main>

    <footer class="bg-gray-900 text-gray-400 py-6 text-center text-sm mt-12">
        <p>&copy; 2026 Distribuidora de gas El Volcán. Proyecto Informática / Duoc UC.</p>
    </footer>
</body>
</html>
